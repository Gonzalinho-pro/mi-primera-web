<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gonza | Instagram</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      background: linear-gradient(135deg, #0f0f0f, #1f1f1f, #111);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }

    .card{
      width:350px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:25px;
      padding:30px;
      text-align:center;
      box-shadow:0 0 30px rgba(0,0,0,0.5);
      animation: aparecer 1s ease;
    }

    @keyframes aparecer{
      from{
        opacity:0;
        transform: translateY(30px);
      }
      to{
        opacity:1;
        transform: translateY(0px);
      }
    }

    .foto{
      width:130px;
      height:130px;
      border-radius:50%;
      margin:auto;
      border:4px solid #ff0066;
      overflow:hidden;
      box-shadow:0 0 20px #ff0066;
    }

    .foto img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    h1{
      margin-top:20px;
      font-size:32px;
    }

    .user{
      color:#ff4d94;
      margin-top:5px;
      font-size:18px;
    }

    p{
      margin-top:20px;
      color:#d1d1d1;
      line-height:1.5;
    }

    .boton{
      display:inline-block;
      margin-top:25px;
      padding:14px 30px;
      background: linear-gradient(45deg,#ff0066,#ff3399);
      border-radius:12px;
      text-decoration:none;
      color:white;
      font-weight:bold;
      transition:0.3s;
      box-shadow:0 0 15px rgba(255,0,102,0.4);
    }

    .boton:hover{
      transform:scale(1.08);
      box-shadow:0 0 25px rgba(255,0,102,0.8);
    }

    .redes{
      margin-top:25px;
      display:flex;
      justify-content:center;
      gap:15px;
    }

    .redes a{
      text-decoration:none;
      color:white;
      font-size:22px;
      transition:0.3s;
    }

    .redes a:hover{
      color:#ff4d94;
      transform:scale(1.2);
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="foto">
      <img src="https://wallpapercave.com/wp/wp6200194.jpg">
    </div>

    <h1>Gonza</h1>

    <div class="user">
      @__gonza.___
    </div>

    <p>
      Seguime soy lindo 🚀
      <br>
      Si boca gana la septima seguime 
    </p>

    <a class="boton" href="https://www.instagram.com/__gonza.___/" target="_blank">
      Ver Instagram
    </a>

    <div class="redes">
      <a href="https://www.instagram.com/__gonza.___/" target="_blank">📸</a>
      <a href="#">💻</a>
      <a href="#">⚽</a>
    </div>

  </div>

</body>
</html>
