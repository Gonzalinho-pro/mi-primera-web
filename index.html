<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Primera Web</title>

  <style>

    body{
      margin: 0;
      background: linear-gradient(to right, #111, #222);
      color: white;
      font-family: Arial;
      text-align: center;
    }

    header{
      padding: 30px;
      background: black;
      font-size: 30px;
      font-weight: bold;
    }

    .contenido{
      margin-top: 100px;
    }

    h1{
      font-size: 60px;
    }

    p{
      font-size: 22px;
      color: lightgray;
    }

    button{
      margin-top: 20px;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background: crimson;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      transform: scale(1.1);
      background: red;
    }

  </style>
</head>

<body>

  <header>
    Mi Primera Página
  </header>

  <div class="contenido">

    <h1>Hola Mundo 🚀</h1>

    <p>
      Estoy aprendiendo programación web
    </p>

    <button onclick="mensaje()">
      Tocame
    </button>

  </div>

  <script>

    function mensaje(){
      alert("Bienvenido a mi primera web 😎");
    }

  </script>

</body>
</html>
