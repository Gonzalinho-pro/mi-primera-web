<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gonzalo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1920') no-repeat center center/cover;
background-size:cover;
color:white;
min-height:100vh;
overflow-x:hidden;
}

.overlay{
background:rgba(0,0,0,0.7);
min-height:100vh;
padding:30px;
}

.container{
max-width:800px;
margin:auto;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(8px);
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
animation:aparecer 1s ease;
}

@keyframes aparecer{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
text-align:center;
font-size:50px;
margin-bottom:20px;
}

.reloj{
text-align:center;
font-size:35px;
margin-bottom:25px;
color:#00ff88;
}

img{
width:250px;
display:block;
margin:auto;
border-radius:20px;
border:4px solid white;
margin-bottom:25px;
}

p{
text-align:center;
font-size:22px;
margin-bottom:20px;
}

.botones{
text-align:center;
margin-top:20px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin:10px;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.redes{
text-align:center;
margin-top:30px;
}

.redes a{
text-decoration:none;
padding:12px 20px;
border-radius:10px;
margin:10px;
display:inline-block;
color:white;
font-size:18px;
transition:0.3s;
}

.instagram{
background:#E1306C;
}

.whatsapp{
background:#25D366;
}

.redes a:hover{
transform:scale(1.05);
}

.juego{
margin-top:40px;
text-align:center;
}

.pelota{
font-size:80px;
cursor:pointer;
transition:0.2s;
}

.pelota:hover{
transform:scale(1.2);
}

.score{
font-size:30px;
margin-top:15px;
}

</style>
</head>

<body>

<div class="overlay">

<div class="container">

<h1>⚽ Gonzalo ⚽</h1>

<div class="reloj" id="hora"></div>

<img src="https://cdn.britannica.com/68/216968-050-8FCA9A13/Brazilian-football-player-Neymar-da-Silva-Santos-Jr-2018.jpg">

<p>
Bienvenido a mi página futbolera 😎
</p>

<div class="botones">

<button onclick="playMusic()">🎵 Música</button>

<button onclick="pauseMusic()">⏸️ Pausar</button>

</div>

<div class="redes">

<a class="instagram"
href="https://instagram.com/__gonza.___"
target="_blank">
📸 Instagram
</a>

<a class="whatsapp"
href="https://wa.me/5493765221479"
target="_blank">
📱 WhatsApp
</a>

</div>

<div class="juego">

<h2>🎮 Mini Juego</h2>

<div class="pelota" onclick="sumarPunto()">
⚽
</div>

<div class="score">
Puntos: <span id="puntos">0</span>
</div>

</div>

</div>

</div>

<audio id="musica" loop>
<source src="./vynth-brazilian-funk-toca-toca-484084.mp3" type="audio/mpeg">
</audio>

<script>

setInterval(()=>{
document.getElementById("hora").innerHTML =
new Date().toLocaleTimeString();
},1000);

let puntos = 0;

function sumarPunto(){
puntos++;
document.getElementById("puntos").innerHTML = puntos;
}

const musica = document.getElementById("musica");

function playMusic(){
musica.volume = 1;
musica.play();
}

function pauseMusic(){
musica.pause();
}

</script>

</body>
</html>
